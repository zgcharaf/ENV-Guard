# A tag produces a DRAFT GitHub release, not an automatic PyPI upload.
# Maintainers review the draft and CI run before publication.
name: Draft release from version tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml','rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match package version'
          PY
      - name: Install packaging tools
        run: python -m pip install 'build>=1.2,<3' 'twine>=6,<8'
      - name: Build and inspect artifacts
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/verify_release.py --dist dist
          python scripts/smoke_release.py --dist dist
          sha256sum dist/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*
            SHA256SUMS.txt
          if-no-files-found: error

  draft-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: artifacts
      - name: Create GitHub draft release (manual review required)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/dist/* artifacts/SHA256SUMS.txt \
            --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
