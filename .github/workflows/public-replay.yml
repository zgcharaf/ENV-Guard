name: Replay independently sourced Python dependency conflict

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/replay_public_conflict.py"
      - "research/validate_public_replay.py"
      - "research/public-exemplars/**"
      - "tests/test_public_replay.py"
      - ".github/workflows/public-replay.yml"

permissions:
  contents: read

jobs:
  replay:
    name: External dependency conflict / minimal pair
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run offline schema and safety tests
        run: python -m unittest discover -s tests -p "test_public_replay.py" -v
      - name: Install EnvGuard from this commit
        run: python -m pip install -e .
      - name: Reproduce public PyPI dependency conflict and bounded correction
        run: >-
          python research/replay_public_conflict.py
          --out research-results/public-replay
      - name: Validate evidence summary and public-exemplar exclusions
        run: >-
          python research/validate_public_replay.py
          --input research-results/public-replay/replay-summary.json
      - name: Preserve only curated evidence, not raw logs or environment snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-incident-minimal-pair
          path: research-results/public-replay/replay-summary.json
          if-no-files-found: warn
          retention-days: 30
