name: Research controlled benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research.yml"

permissions:
  contents: read

jobs:
  controlled-comparison:
    name: Reproduce synthetic lab and metadata checkers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install EnvGuard and uv comparator
        run: python -m pip install -e . "uv>=0.9,<1"
      - name: Run fully controlled injected faults
        run: python lab/run_lab.py --out research-results/lab
      - name: Audit pip and uv against the identical virtual environments
        run: >-
          python research/compare_tools.py
          --lab-output research-results/lab
          --out research-results/comparison.json --require-uv
      - name: Validate benchmark record
        run: >-
          python research/validate_research.py
          research-results/lab/benchmark.json
          research-results/comparison.json
      - name: Upload controlled benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-controlled-benchmark
          path: |
            research-results/lab/benchmark.json
            research-results/comparison.json
          if-no-files-found: warn
          retention-days: 30
