# This workflow is DISABLED until a maintainer intentionally dispatches it
# from a release tag AND configures a PyPI trusted publisher and protected
# GitHub environment named 'pypi'. It never runs from a pull request or push.
name: Publish validated release to PyPI (manual, protected)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml','rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: python -m pip install 'build>=1.2,<3' 'twine>=6,<8'
      - name: Build and validate
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/verify_release.py --dist dist
          python scripts/smoke_release.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pypi-dists
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pypi-dists
          path: dist/
      - name: Publish using PyPI trusted publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
